name: Release-build

on:
  push:
    tags:
      - v*

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  PYTHONPATH: src
  # this will push the codecoverage from
  TARGETPY: "3.14"
  TARGETOS: "ubuntu-latest"


jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.14"]
    runs-on: ${{ matrix.os }}

    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # WARNING!! this is important
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      # https://github.com/actions/setup-python
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # https://github.com/astral-sh/setup-uv
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install dependencies
        shell: bash
        run: |
          uv sync --no-managed-python

      - name: Checks & Balances
        shell: bash
        run: |
          uv run python support/checks-and-balances.py

      - name: Run Python checks (ruff+format)
        run: uv run ruff format --exit-non-zero-on-format src tests

      - name: Run Python checks (ruff+check)
        run: uv run ruff check --fix --exit-non-zero-on-fix --show-fixes src tests

      - name: Run Python checks (mypy)
        shell: bash
        env:
          OUTDIR: build/qa-${{ matrix.python-version }}-${{ matrix.os}}
        run: |
          mkdir -p $OUTDIR
          uv run mypy src tests \
            --no-incremental --xslt-html-report $OUTDIR/mypy

      - name: Run Python checks (tests+coverage)
        env:
          OUTDIR: build/qa-${{ matrix.python-version }}-${{ matrix.os}}
        shell: bash
        run: |
          mkdir -p ${OUTDIR}
          uv run pytest -vvs -l \
              --cov=$(basename src/*) \
              --cov-report=html:$OUTDIR/coverage --cov-report=xml:$OUTDIR/coverage.xml \
              --junitxml=$OUTDIR/junit/junit.xml --html=$OUTDIR/junit/junit.html --self-contained-html \
            tests

      - name: Create wheel (only on ${{ env.TARGETPY }}, ${{ env.TARGETOS }})
        uses: cav71/action-build-wheel@uv
        with:
          mode: release
          flags: '-J'
          files: |
            README.md
            src/acbox/__init__.py
          move: build/qa-${{ matrix.python-version }}-${{ matrix.os}}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        if: ${{ (matrix.python-version == env.TARGETPY) && (matrix.os == env.TARGETOS) }}
        with:
          files: build/qa-${{ matrix.python-version }}-${{ matrix.os}}/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true # optional (default = false)

      - name: Archive artifacts
        uses: actions/upload-artifact@v7
        with:
          name: qa-results-${{ matrix.python-version }}-${{ matrix.os }}
          path: |
            build/qa-${{ matrix.python-version }}-${{ matrix.os}}/dist
        # Use always() to always run this step to publish test results when there are test failures
        if: always()

  pypi-publish:
    name: upload release to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: qa-results-3.14-ubuntu-latest
          path: |
            build/qa-3.14-ubuntu-latest
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
           packages-dir: ./build/qa-3.14-ubuntu-latest

name: Pull-Request

on:
  pull_request:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  PACKAGE: acbox
  PYTHONPATH: src
  GITHUB_DUMP: ${{ {"ref": toJson(github).ref} }}
  TARGETPY: "3.13"
  TARGETOS: "ubuntu-latest"

jobs:
  build:
    strategy:
      matrix:
        #os: [ubuntu-latest, macos-latest, windows-latest]
        #python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        python-version: ["3.9"]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Dump ENV
        shell: bash
        run: |
          echo "=== GITHUB_DUMP ==="
          echo "$GITHUB_DUMP" | python -m json.tool 
          echo "=== END GITHUB_DUMP ==="
      
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # https://github.com/actions/setup-python
      - name: Setup Python toolchain
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Python dependencies
        shell: bash
        run: |
            python -m pip install --upgrade pip
            python -m pip install --group dev

      - name: Checks & Balances
        shell: bash
        run: |
            python release/checks-and-balances.py

      - name: Run Python checks (ruff)
        shell: bash
        run: |
            ruff check src tests
            ruff format --check src tests

      - name: Run Python checks (mypy)
        shell: bash
        env:
          OUTDIR: build/qa-${{ matrix.python-version }}-${{ matrix.os}}
        run: |
            mypy src tests \
              --no-incremental --xslt-html-report $OUTDIR/mypy

      - name: Run Python checks (tests)
        shell: bash
        env:
          OUTDIR: build/qa-${{ matrix.python-version }}-${{ matrix.os}}
        run: |
          py.test \
              --cov=${{ env.PACKAGE }} \
              --cov-report=html:$OUTDIR/coverage --cov-report=xml:$OUTDIR/coverage.xml \
              --junitxml=$OUTDIR/junit/junit.xml --html=$OUTDIR/junit/junit.html --self-contained-html \
            tests

      # https://github.com/codecov/codecov-action
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: $OUTDIR/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true # optional (default = false)

